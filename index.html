<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <div class="flower" aria-hidden="true">🌸</div>
      <h1>My To-Do List</h1>
      <p>Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input">Task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" required />
      <label for="task-time">Time</label>
      <input id="task-time" type="time" required />
      <button type="submit" class="add-button">+ Add Task</button>
    </form>

    <section class="task-section" aria-labelledby="task-heading">
      <div class="list-heading">
        <h2 id="task-heading">Your Tasks</h2>
        <span id="task-count" class="task-count">0 tasks</span>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-message" class="empty-message">No tasks yet. Add one above! 💗</p>
    </section>
    <footer>Made with 💗 • Your tasks stay saved in this browser.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
