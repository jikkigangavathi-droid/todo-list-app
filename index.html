<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STAY ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Small steps make big progress.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">Enter a task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>

    <section class="task-summary" aria-live="polite">
      <span id="task-count">0 tasks left</span>
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
    </section>

    <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add your first task above!</p>

    <footer>Tasks are saved in this browser automatically.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
