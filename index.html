<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cursive To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List 🌸</h1>
    <p class="subtitle">Plan your day with a little pink magic</p>
    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">Task</label>
      <input id="task-input" type="text" placeholder="Write your task..." maxlength="120" required>
      <label class="sr-only" for="task-time">Task time</label>
      <input id="task-time" type="time" required>
      <button type="submit">Add Task +</button>
    </form>
    <p id="empty-message" class="empty-message">Your lovely task list is empty. Add a task to begin! 💕</p>
    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <footer>One step at a time ✨</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
