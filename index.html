<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pink To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="flower">🌸</div>
      <h1>My To-Do List</h1>
      <p>Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input">Task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" required />
      <label for="task-time">Time</label>
      <input id="task-time" type="time" required />
      <button type="submit">+ Add Task</button>
    </form>

    <section class="tasks-section" aria-live="polite">
      <div class="section-heading">
        <h2>Today's Tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">No tasks yet. Add your first task above! 💗</p>
    </section>
    <footer>Made with 💗 · Your tasks are saved in this browser.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
